# Default Compose file (production). Plain commands work:
#   docker compose up -d --build
#   docker compose logs api -f
# Local full stack: docker compose -f compose.dev.yml up --build
# Frontend stays on Vercel (default). Optional same-host UI: --profile frontend
# See docs/deploy.md

x-api-environment: &api-environment
  APP_ENV: production
  DATABASE_URL: postgresql+asyncpg://freelance:${POSTGRES_PASSWORD}@db:5432/freelance
  REDIS_URL: redis://redis:6379/0
  REDIS_OPTIONAL: "false"
  JWT_SECRET_KEY: ${JWT_SECRET_KEY:?Set JWT_SECRET_KEY}
  CORS_ORIGINS: ${CORS_ORIGINS:?Set CORS_ORIGINS}
  SCRAPE_ON_STARTUP: ${SCRAPE_ON_STARTUP:-true}
  SCRAPE_INTERVAL_MINUTES: ${SCRAPE_INTERVAL_MINUTES:-15}
  SCRAPE_SOURCES: ${SCRAPE_SOURCES:-serpapi_freelance,serpapi_jobs,serpapi_companies}
  GROQ_API_KEY: ${GROQ_API_KEY:-}
  NVIDIA_API_KEY: ${NVIDIA_API_KEY:-}
  GEMINI_API_KEY: ${GEMINI_API_KEY:-}
  OPENAI_API_KEY: ${OPENAI_API_KEY:-}
  ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
  SERPAPI_API_KEY: ${SERPAPI_API_KEY:-}
  # Do not pass empty SERPAPI_*_QUERY here — blank env overrides code defaults
  # and SerpAPI returns 400 (q=). Set real queries in .env if you need overrides.
  UPWORK_CLIENT_ID: ${UPWORK_CLIENT_ID:-}
  UPWORK_CLIENT_SECRET: ${UPWORK_CLIENT_SECRET:-}
  UPWORK_REDIRECT_URI: ${UPWORK_REDIRECT_URI:-}
  UPWORK_ACCESS_TOKEN: ${UPWORK_ACCESS_TOKEN:-}
  UPWORK_REFRESH_TOKEN: ${UPWORK_REFRESH_TOKEN:-}
  FREELANCER_OAUTH_TOKEN: ${FREELANCER_OAUTH_TOKEN:-}
  APIFY_TOKEN: ${APIFY_TOKEN:-}
  SLACK_WEBHOOK_URL: ${SLACK_WEBHOOK_URL:-}
  DISCORD_WEBHOOK_URL: ${DISCORD_WEBHOOK_URL:-}
  TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
  TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID:-}
  WHATSAPP_TWILIO_SID: ${WHATSAPP_TWILIO_SID:-}
  WHATSAPP_TWILIO_TOKEN: ${WHATSAPP_TWILIO_TOKEN:-}
  WHATSAPP_TWILIO_FROM: ${WHATSAPP_TWILIO_FROM:-}
  WHATSAPP_TO: ${WHATSAPP_TO:-}
  EMAIL_SMTP_HOST: ${EMAIL_SMTP_HOST:-}
  EMAIL_SMTP_PORT: ${EMAIL_SMTP_PORT:-587}
  EMAIL_USERNAME: ${EMAIL_USERNAME:-}
  EMAIL_PASSWORD: ${EMAIL_PASSWORD:-}
  EMAIL_FROM: ${EMAIL_FROM:-}
  EMAIL_TO: ${EMAIL_TO:-}
  STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
  STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
  STRIPE_PRICE_PRO: ${STRIPE_PRICE_PRO:-}
  STRIPE_SUCCESS_URL: ${STRIPE_SUCCESS_URL:-}
  STRIPE_CANCEL_URL: ${STRIPE_CANCEL_URL:-}
  PUBLIC_APP_URL: ${PUBLIC_APP_URL:-}
  SENTRY_DSN: ${SENTRY_DSN:-}
  AWS_SECRETS_MANAGER_ARN: ${AWS_SECRETS_MANAGER_ARN:-}
  AWS_REGION: ${AWS_REGION:-us-east-1}

services:
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      # Set CADDY_BIND=127.0.0.1 when the Cloudflare tunnel is the only public entry.
      - "${CADDY_BIND:-0.0.0.0}:80:80"
      - "${CADDY_BIND:-0.0.0.0}:443:443"
    environment:
      - DOMAIN=${PUBLIC_DOMAIN:-localhost}
    volumes:
      # Default: API-only (Vercel frontend). Bundled UI: CADDYFILE=./Caddyfile --profile frontend
      - ${CADDYFILE:-./Caddyfile.api}:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - api

  cloudflared:
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    profiles: ["cloudflare"]
    command: tunnel --no-autoupdate run --token ${CLOUDFLARE_TUNNEL_TOKEN:-}
    depends_on:
      - caddy

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: freelance
      POSTGRES_USER: freelance
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U freelance -d freelance"]
      interval: 10s
      timeout: 5s
      retries: 5

  db-backup:
    build:
      context: .
      dockerfile: docker/db-backup/Dockerfile
    restart: unless-stopped
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
      S3_BUCKET: ${S3_BACKUP_BUCKET:-}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      AWS_DEFAULT_REGION: ${AWS_DEFAULT_REGION:-us-east-1}
    volumes:
      - db_backups:/backups
    depends_on:
      db:
        condition: service_healthy

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  adminer:
    image: adminer:latest
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:8080" # Only accessible locally or via SSH tunnel for security
    depends_on:
      db:
        condition: service_healthy

  api:
    build:
      context: .
      dockerfile: fastapi/Dockerfile
    restart: unless-stopped
    # Trust only the compose network (Caddy). Avoid wildcard forwarded-allow-ips.
    command: >
      sh -c "alembic -c database/alembic.ini upgrade head &&
      uvicorn app.main:app --host 0.0.0.0 --port 8000 --proxy-headers --forwarded-allow-ips=172.16.0.0/12,10.0.0.0/8,192.168.0.0/16 "
    environment:
      <<: *api-environment
    expose:
      - "8000"
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    build:
      context: .
      dockerfile: fastapi/Dockerfile
    restart: unless-stopped
    command: celery -A workers.app.celery_app worker --loglevel=info --concurrency=2
    environment:
      <<: *api-environment
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  beat:
    build:
      context: .
      dockerfile: fastapi/Dockerfile
    restart: unless-stopped
    command: celery -A workers.app.celery_app beat --loglevel=info
    environment:
      <<: *api-environment
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    depends_on:
      redis:
        condition: service_healthy
      worker:
        condition: service_started

  frontend:
    profiles: ["frontend"]
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: ${PUBLIC_API_URL:?Set PUBLIC_API_URL}
    restart: unless-stopped
    expose:
      - "3000"
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    depends_on:
      - api

volumes:
  postgres_data:
  redis_data:
  caddy_data:
  caddy_config:
  db_backups:
