# =============================================================================
# Signal Desk - Nginx Reverse Proxy Configuration (IP-based / No Domain)
#
# Use this when accessing via raw GCP External IP or nip.io / sslip.io.
# Place in: /etc/nginx/sites-available/signaldesk.conf
# =============================================================================

# Rate limiting zone for API requests (10 req/s with burst of 20)
limit_req_zone $binary_remote_addr zone=signaldesk_api_limit:10m rate=10r/s;

# Option A: Path-based routing on existing host HTTP (Port 80)
# If you want to access via: http://<YOUR_VM_EXTERNAL_IP>/api/
# Or directly route on dedicated port 8002.

server {
    listen 8002;
    server_name _;

    client_max_body_size 25M;
    client_body_buffer_size 128k;

    location / {
        limit_req zone=signaldesk_api_limit burst=20 nodelay;

        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 60s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;
        proxy_buffering off;
    }
}

