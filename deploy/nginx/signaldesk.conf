# =============================================================================
# Signal Desk - Nginx Reverse Proxy Configuration
# Place this in /etc/nginx/sites-available/signaldesk.conf on your GCP VM
# and symlink to /etc/nginx/sites-enabled/
# =============================================================================

# Rate limiting zone for API requests (10 req/s with burst of 20)
limit_req_zone $binary_remote_addr zone=signaldesk_api_limit:10m rate=10r/s;

# Initial HTTP server (Certbot will automatically add the SSL block)
server {
    listen 80;
    listen [::]:80;
    server_name api.faizanmalik.me;

    client_max_body_size 25M;
    client_body_buffer_size 128k;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
        allow all;
    }

    location / {
        limit_req zone=signaldesk_api_limit burst=20 nodelay;

        proxy_pass http://127.0.0.1:8002;
        proxy_http_version 1.1;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;

        proxy_connect_timeout 60s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;
        proxy_buffering off;
    }
}
