# =============================================================================
# Signal Desk - Nginx Reverse Proxy Configuration
# Place this in /etc/nginx/sites-available/signaldesk.conf on your GCP VM
# and symlink to /etc/nginx/sites-enabled/
#
# Replace:
#   api.yourdomain.com -> Your actual API subdomain or public IP
# =============================================================================

# Rate limiting zone for API requests (10 req/s with burst of 20)
limit_req_zone $binary_remote_addr zone=signaldesk_api_limit:10m rate=10r/s;

# HTTP -> HTTPS redirect
server {
    listen 80;
    listen [::]:80;
    server_name api.yourdomain.com;

    # Let's Encrypt / Certbot challenge validation
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        allow all;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS Reverse Proxy to Docker FastAPI container (127.0.0.1:8002)
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name api.yourdomain.com;

    # SSL Certificates (Managed by certbot or your certificate authority)
    ssl_certificate /etc/letsencrypt/live/api.yourdomain.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.yourdomain.com/privkey.pem;

    # Modern TLS configuration
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # Security headers
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Request limits
    client_max_body_size 25M;
    client_body_buffer_size 128k;

    # Proxy to FastAPI container on port 8002
    location / {
        limit_req zone=signaldesk_api_limit burst=20 nodelay;

        proxy_pass http://127.0.0.1:8002;
        proxy_http_version 1.1;

        # WebSocket support (if needed for telemetry / live updates)
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Forwarded client headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;

        # Timeouts for background jobs / long scraping previews
        proxy_connect_timeout 60s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;

        # Disable buffering for streaming responses
        proxy_buffering off;
    }
}

