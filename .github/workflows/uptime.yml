name: Uptime

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Ping /health/live
        env:
          UPTIME_URL: ${{ secrets.UPTIME_URL }}
        run: |
          if [ -z "$UPTIME_URL" ]; then
            echo "UPTIME_URL secret is not configured; skipping scheduled uptime check." >&2
            echo "Add repository secret UPTIME_URL (public API origin or /health/live URL) to enable monitoring." >&2
            exit 0
          fi
          python scripts/uptime_check.py
