name: Uptime

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Ping /health/live
        env:
          UPTIME_URL: ${{ secrets.UPTIME_URL }}
        run: |
          if [ -z "$UPTIME_URL" ]; then
            echo "UPTIME_URL secret is required; refusing to report healthy" >&2
            exit 1
          fi
          python scripts/uptime_check.py
